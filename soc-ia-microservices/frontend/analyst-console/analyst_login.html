<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Seguro | SOC-IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-card">
        <div class="logo">🛡️ SOC-IA</div>
        <div class="subtitle">Autenticación de Operador del Centro de Seguridad</div>
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Correo Institucional</label>
                    <input id="email" type="email" value="analista.soc@empresa.com" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                    <input id="password" type="password" value="soc-ia-2025" required>
            </div>
            <div class="form-group">
                <label>Código de Autenticación MFA (OTP)</label>
                    <input id="otp" type="text" placeholder="123 456" maxlength="6" required value="482910">
            </div>
            <button type="submit" class="btn-submit">Ingresar a la Consola</button>
        </form>
            <div id="login-error" class="footer-note" style="color: #ff7a7a; display: none;"></div>
            <div class="footer-note">Acceso restringido y auditado. Cumple con NIST SP 800-63B.</div>
        </div>
        <script>
            async function handleLogin(e) {
                e.preventDefault();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const otp = document.getElementById('otp').value.trim();
                const errorBox = document.getElementById('login-error');

                try {
                    const res = await fetch('/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password, otp })
                    });
                    const data = await res.json();

                    if (!res.ok) {
                        throw new Error(data.detail || 'No se pudo iniciar sesión');
                    }

                    localStorage.setItem('soc_token', data.token);
                    window.location.href = '/';
                } catch (err) {
                    errorBox.textContent = err.message;
                    errorBox.style.display = 'block';
                }
            }
        </script>
</body>
</html>
