<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Seguro | SOC-IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-card">
        <div class="logo">🛡️ SOC-IA</div>
        <div class="subtitle">Autenticación de Operador del Centro de Seguridad</div>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Correo Institucional</label>
                <input type="email" value="analista.soc@empresa.com" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" value="••••••••••••" required>
            </div>
            <div class="form-group">
                <label>Código de Autenticación MFA (OTP)</label>
                <input type="text" placeholder="123 456" maxlength="6" required value="482910">
            </div>
            <button type="submit" class="btn-submit">Ingresar a la Consola</button>
        </form>
        <div class="footer-note">Acceso restringido y auditado. Cumple con NIST SP 800-63B.</div>
    </div>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            window.location.href = '/';
        }
    </script>
</body>
</html>
